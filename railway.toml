# Configures this repo's primary "web" service. Two more Railway services
# point at this same repo but aren't defined here — Railway's schema doesn't
# express independently-scheduled multi-service setups in one railway.toml,
# so they're created via the dashboard:
#   - "postgres": Railway's managed Postgres plugin. Injects DATABASE_URL.
#   - "cron": same repo/build, start command overridden to
#     `python -m agent.jobs.run_all`, with a Cron Schedule of `0 4 * * 1`
#     (04:00 UTC = 9:30am IST, Mondays) set in that service's Settings tab.
#     No Volume on either service — see agent/web/routes_menu.py, images are
#     never persisted.

# Built from the repo-root Dockerfile, not auto-detected. Both of Railway's
# own auto-build systems failed on this repo before this was added: Railpack
# couldn't tell how to build a Python app whose requirements.txt isn't at
# the repo root ("could not determine how to build the app"), and Nixpacks
# generated a broken internal Dockerfile regardless of what nixpacks.toml
# said ("ENV names can not be blank", a bug in its own auto-generation, not
# anything in this repo's config). A hand-written Dockerfile removes both
# failure modes by giving full control instead of relying on either one's
# auto-detection.

[build]
builder = "DOCKERFILE"

[deploy]
restartPolicyType = "ON_FAILURE"
