# Configures this repo's primary "web" service. Two more Railway services
# point at this same repo but aren't defined here — Railway's schema doesn't
# express independently-scheduled multi-service setups in one railway.toml,
# so they're created via the dashboard:
#   - "postgres": Railway's managed Postgres plugin. Injects DATABASE_URL.
#   - "cron": same repo/build, start command overridden to
#     `python -m agent.jobs.run_all`, with a Cron Schedule of `0 4 * * 1`
#     (04:00 UTC = 9:30am IST, Mondays) set in that service's Settings tab.
#     No Volume on either service — see agent/web/routes_menu.py, images are
#     never persisted.

# Build steps (setup/install/start) live in nixpacks.toml at the repo root —
# Nixpacks' own auto-detection was generating a broken Dockerfile since
# requirements.txt isn't at the repo root, so it's now spelled out
# explicitly there instead of duplicated/possibly conflicting with this file.
# `builder` still has to be pinned here, though: without it Railway falls
# back to its newer default builder ("Railpack"), which doesn't read
# nixpacks.toml at all and fails with "could not determine how to build
# the app" even though the files are all right there.

[build]
builder = "NIXPACKS"

[deploy]
restartPolicyType = "ON_FAILURE"
