<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Forkcast{% endblock %}</title>
  <meta name="theme-color" content="#FDFAF5">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300..700&display=swap">
  <link rel="stylesheet" href="/static/forkcast.css?v=3">
</head>
<body>
  {% if toast %}<div class="toast" data-autohide>{{ toast }}</div>{% endif %}
  {% block body %}{% endblock %}
  <script src="/static/forkcast.js?v=3"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
