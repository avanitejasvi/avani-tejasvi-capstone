[alembic]
script_location = agent/alembic
prepend_sys_path = .
# Intentionally blank — agent/alembic/env.py builds the URL from DATABASE_URL
# via agent.db.get_engine() so there's one place that knows how to fix
# Railway's postgres:// scheme, not two.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
